name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [deskVersion1.0]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            bundles: nsis
          - platform: macOS
            os: macos-latest
            bundles: app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: npm run desktop:build -- --bundles ${{ matrix.bundles }}
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/release/bundle/macos/DRAW.app DRAW-macOS.zip
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: DRAW-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: DRAW-macOS
          path: DRAW-macOS.zip
          if-no-files-found: error
